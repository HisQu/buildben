name: CI

run-name: ${{ github.actor }} - ${{ github.event_name }} - CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: buildben-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: Select Python versions
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.versions.outputs.python }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Select check profile
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          versions='["3.12"]'
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" =~ b[1-9][0-9]*$ ]]; then
              versions='["3.13"]'
            elif [[ "$GITHUB_REF_NAME" =~ rc[1-9][0-9]*$ ]]; then
              versions='["3.12","3.13"]'
            elif ! PYTHONPATH=src python -m buildben_dev.packaging.release_assets rc-evidence \
                --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"; then
              versions='["3.12","3.13"]'
            fi
          fi
          echo "python=$versions" >> "$GITHUB_OUTPUT"

  checks:
    needs: profile
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version: ${{ fromJSON(needs.profile.outputs.python) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"

      - name: Install project from uv.lock
        run: uv sync --locked --all-extras --all-groups

      - name: Check lockfile
        if: matrix.python-version == '3.12'
        run: uv lock --check


      - name: Check formatting
        if: matrix.python-version == '3.12'
        run: uv run --locked ruff format . --check

      - name: Lint
        if: matrix.python-version == '3.12'
        run: uv run --locked ruff check .

      - name: Type check
        if: matrix.python-version == '3.12'
        run: uv run --locked pyright

      - name: Test
        env:
          NO_COLOR: "1"
        run: uv run --locked python -m pytest

      - name: Compile sources
        if: matrix.python-version == '3.12'
        run: uv run --locked python -m compileall -q src tests

  frontend-scaffold:
    needs: profile
    if: github.ref_type == 'tag' && contains(needs.profile.outputs.python, '3.12') && contains(needs.profile.outputs.python, '3.13')
    name: Frontend scaffold consumer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          package-manager-cache: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: auto
      - name: Install project from uv.lock
        run: uv sync --locked --all-extras --all-groups
      - name: Run frontend scaffold consumer test
        env:
          BUILDBEN_FRONTEND_SMOKE: "1"
        run: uv run --locked python -m pytest -o addopts= tests/test_init_proj.py -k frontend
      - name: Run generated React package consumer test
        run: >-
          uv run --locked python -m pytest -o addopts=
          tests/test_release_install.py::test_generated_react_python_packages_select_one_workspace_without_native_build
