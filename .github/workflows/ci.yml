name: CI

run-name: ${{ github.actor }} - ${{ github.event_name }} - CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"

      - name: Install project from uv.lock
        run: uv sync --locked --all-extras --all-groups

      - name: Check lockfile
        run: uv lock --check

      - name: Check generated installer artifacts
        run: just check-artifacts

      - name: Check formatting
        run: uv run --locked ruff format . --check

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked pyright

      - name: Test
        env:
          NO_COLOR: "1"
        run: uv run --locked python -m pytest

      - name: Compile sources
        run: uv run --locked python -m compileall -q src tests

  frontend-scaffold:
    name: Frontend scaffold consumer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.2"
          package-manager-cache: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: auto
      - name: Install project from uv.lock
        run: uv sync --locked --all-extras --all-groups
      - name: Run frontend scaffold consumer test
        env:
          BUILDBEN_FRONTEND_SMOKE: "1"
        run: uv run --locked python -m pytest -o addopts= tests/test_init_proj.py -k frontend

  installation:
    name: ${{ matrix.target }} install / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            python-version: "3.12"
            target: linux-x86_64
            installer-client: curl
          - runner: ubuntu-latest
            python-version: "3.13"
            target: linux-x86_64
            installer-client: gh
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - name: Install project from uv.lock
        run: uv sync --locked --all-extras --all-groups
      - name: Run source-installer consumer smoke
        env:
          GH_TOKEN: ${{ github.token }}
          INSTALLER_SMOKE_CLIENT: ${{ matrix.installer-client }}
        run: just release-install-smoke
