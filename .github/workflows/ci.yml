name: CI

run-name: ${{ github.actor }} - ${{ github.event_name }} - CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.12"
          - "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto

      - name: Install project from uv.lock
        run: uv sync --locked --all-groups

      - name: Check lockfile
        run: uv lock --check

      - name: Check formatting
        run: uv run --locked ruff format . --check

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked pyright

      - name: Test
        env:
          NO_COLOR: "1"
        run: uv run --locked pytest

      - name: Compile sources
        run: uv run --locked python -m compileall -q src tests
