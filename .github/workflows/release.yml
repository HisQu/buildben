name: Release

run-name: ${{ github.actor }} - ${{ inputs.release_tag || github.ref_name }} - Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing non-draft GitHub Release; PyPI must be enabled in workflow ref and tag
        required: true
        type: string

concurrency:
  group: buildben-release
  cancel-in-progress: false

jobs:
  checks:
    name: Full CI
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  build:
    name: Build release artifacts
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_pypi: ${{ steps.release_policy.outputs.release_pypi }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: auto

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"

      - name: Validate release policy
        id: release_policy
        shell: bash
        run: |
          release_pypi="$(just --evaluate RELEASE_PYPI)"
          if [[ "$release_pypi" != "true" && "$release_pypi" != "false" ]]; then
            echo "RELEASE_PYPI must be \"true\" or \"false\", found '${release_pypi}'." >&2
            exit 1
          fi
          echo "release_pypi=${release_pypi}" >> "$GITHUB_OUTPUT"

      - name: Build and validate release bundle
        run: just _release-artifact-check release/release-notes.md

      - name: Preserve release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release/release-notes.md
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Restore release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle-${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "Buildben ${release_version}" \
            --notes-file release/release-notes.md

  pypi-publish:
    name: Publish to PyPI
    if: >-
      github.event_name == 'push' &&
      needs.build.outputs.release_pypi == 'true'
    needs:
      - build
      - github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Restore release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle-${{ github.ref_name }}

      - name: Publish to PyPI with trusted publishing
        shell: bash
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/buildben/ \
            dist/*

  manual_pypi_preflight:
    name: Check manual PyPI release policy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish_pypi: ${{ steps.release_policy.outputs.publish_pypi }}

    steps:
      - name: Checkout active workflow ref
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"

      - name: Validate active workflow ref and requested tag
        id: release_policy
        env:
          ACTIVE_WORKFLOW_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag '${RELEASE_TAG}'; expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if ! active_commit="$(git rev-parse --verify "${ACTIVE_WORKFLOW_REF}^{commit}" 2>/dev/null)"; then
            echo "Active workflow ref ${ACTIVE_WORKFLOW_REF} does not resolve to a commit." >&2
            exit 1
          fi
          if ! git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"; then
            echo "Could not fetch target tag ${RELEASE_TAG}." >&2
            exit 1
          fi
          if ! target_commit="$(git rev-parse --verify "${RELEASE_TAG}^{commit}" 2>/dev/null)"; then
            echo "Target tag ${RELEASE_TAG} does not resolve to a commit." >&2
            exit 1
          fi

          read_release_policy() {
            local commit="$1"
            local ref_name="$2"
            local policy_file
            local release_pypi
            policy_file="$(mktemp)"
            if ! git show "${commit}:justfile" > "$policy_file"; then
              rm -f "$policy_file"
              echo "Could not read justfile from ${ref_name}." >&2
              return 1
            fi
            if ! release_pypi="$(just --no-dotenv --justfile "$policy_file" --evaluate RELEASE_PYPI)"; then
              rm -f "$policy_file"
              echo "Could not evaluate RELEASE_PYPI from ${ref_name}." >&2
              return 1
            fi
            rm -f "$policy_file"
            if [[ "$release_pypi" != "true" && "$release_pypi" != "false" ]]; then
              echo "RELEASE_PYPI must be \"true\" or \"false\" in ${ref_name}, found '${release_pypi}'." >&2
              return 1
            fi
            printf '%s\n' "$release_pypi"
          }

          active_policy="$(read_release_policy "$active_commit" "active workflow ref ${ACTIVE_WORKFLOW_REF}")"
          target_policy="$(read_release_policy "$target_commit" "target tag ${RELEASE_TAG}")"
          publish_pypi=false
          if [[ "$active_policy" == "true" && "$target_policy" == "true" ]]; then
            publish_pypi=true
          else
            echo "Manual PyPI publication is disabled unless RELEASE_PYPI is \"true\" in both committed justfiles."
          fi
          echo "publish_pypi=${publish_pypi}" >> "$GITHUB_OUTPUT"

  publish-existing-release:
    name: Publish existing GitHub Release to PyPI
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.manual_pypi_preflight.outputs.publish_pypi == 'true'
    needs: manual_pypi_preflight
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Download and validate GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag '${RELEASE_TAG}'; expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if ! is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            echo "GitHub Release ${RELEASE_TAG} does not exist." >&2
            exit 1
          fi
          if [[ "$is_draft" == "true" ]]; then
            echo "GitHub Release ${RELEASE_TAG} is still a draft." >&2
            exit 1
          fi

          mkdir dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern '*.whl' \
            --pattern '*.tar.gz'

          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          version="${RELEASE_TAG#v}"
          if [[ "${#wheels[@]}" -ne 1 || "${#sdists[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel and one source archive on ${RELEASE_TAG}." >&2
            exit 1
          fi
          if [[ "$(basename "${wheels[0]}")" != buildben-${version}-*.whl ]]; then
            echo "The wheel filename does not match ${RELEASE_TAG}: ${wheels[0]}." >&2
            exit 1
          fi
          if [[ "$(basename "${sdists[0]}")" != "buildben-${version}.tar.gz" ]]; then
            echo "The source archive filename does not match ${RELEASE_TAG}: ${sdists[0]}." >&2
            exit 1
          fi
          uv run --with twine --no-project -- twine check "${wheels[0]}" "${sdists[0]}"

      - name: Publish existing artifacts to PyPI
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/buildben/ \
            dist/*
