name: Release

run-name: ${{ github.actor }} - ${{ inputs.release_tag || github.ref_name }} - Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing non-draft GitHub Release; PyPI must be enabled in workflow ref and tag
        required: true
        type: string

concurrency:
  group: {my_project}-release
  cancel-in-progress: false

jobs:
  checks:
    name: Exact-commit CI
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Wait for normal CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=src python -m {my_project}_dev.packaging.release_assets
          wait-ci --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"

  prepare-draft:
    name: Prepare draft release
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      release_notes_base64: ${{ steps.prepare.outputs.release_notes_base64 }}
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Prepare or reuse the tag draft
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p release
          version="$(uv version --short)"
          python src/{my_project}_dev/packaging/release_notes.py \
            "$version" --tag "$GITHUB_REF_NAME" --project-version "$version" \
            --output release/release-notes.md
          PYTHONPATH=src python -m {my_project}_dev.packaging.release_assets prepare \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" --notes release/release-notes.md
          notes_base64="$(base64 -w 0 release/release-notes.md)"
          echo "release_notes_base64=${notes_base64}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and stage common release inputs
    if: github.event_name == 'push'
    needs: prepare-draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_pypi: ${{ steps.release_policy.outputs.release_pypi }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: auto
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - name: Validate release policy
        id: release_policy
        shell: bash
        run: |
          release_pypi="$(just --evaluate RELEASE_PYPI)"
          if [[ "$release_pypi" != "true" && "$release_pypi" != "false" ]]; then
            echo "RELEASE_PYPI must be \"true\" or \"false\", found '${release_pypi}'." >&2
            exit 1
          fi
          echo "release_pypi=${release_pypi}" >> "$GITHUB_OUTPUT"
      - name: Restore prepared release notes
        env:
          RELEASE_NOTES_BASE64: ${{ needs.prepare-draft.outputs.release_notes_base64 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          printf '%s' "$RELEASE_NOTES_BASE64" | base64 --decode > release/release-notes.md
      - name: Build and validate package once
        run: just build-release-inputs release/release-notes.md
      - name: Upload common inputs to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < <(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) -printf '%f\n' | LC_ALL=C sort)
          if [[ "${#packages[@]}" -ne 2 ]]; then
            echo "Expected exactly one wheel and one source archive." >&2
            exit 1
          fi
          PYTHONPATH=src python -m {my_project}_dev.packaging.release_assets upload \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" --directory dist --files \
            "${packages[@]}" runtime-requirements.txt runtime-constraints.txt \
            release-manifest.json release-notes.md install-linux-macos.sh \
            install-windows.ps1 install_release.py

  installation-bundle:
    name: ${{ matrix.target }} installation proof
    if: github.event_name == 'push'
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            python-version: "3.12"
            target: windows-x86_64
          - runner: ubuntu-latest
            python-version: "3.12"
            target: linux-x86_64
          - runner: macos-14
            python-version: "3.12"
            target: macos-arm64
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - name: Fetch common payload and assemble native archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=src python -m {my_project}_dev.packaging.release_assets fetch \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" --directory dist --files \
            release-manifest.json
          wheel_name="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["application_wheel"]["filename"])' dist/release-manifest.json)"
          sdist_name="$(python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["source_archive"]["filename"])' dist/release-manifest.json)"
          PYTHONPATH=src python -m {my_project}_dev.packaging.release_assets fetch \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" --directory dist --files \
            "$wheel_name" "$sdist_name" \
            runtime-requirements.txt runtime-constraints.txt release-manifest.json \
            release-notes.md install-linux-macos.sh install-windows.ps1 install_release.py
          PYTHONPATH=src python -m {my_project}_dev.packaging.installation_bundle archive \
            --release-directory dist --output-directory dist
      - name: Smoke the staged archive through its native installer
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          target="${{ matrix.target }}"
          archives=(dist/*-"$target".zip dist/*-"$target".tar.gz)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "Expected one archive for $target." >&2
            exit 1
          fi
          RELEASE_TARGET="$target" RELEASE_ARCHIVE="${archives[0]}" just release-install-smoke
      - name: Upload platform archive to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          target="${{ matrix.target }}"
          archives=(dist/*-"$target".zip dist/*-"$target".tar.gz)
          if [[ "${#archives[@]}" -ne 1 ]]; then
            echo "Expected one archive for $target." >&2
            exit 1
          fi
          archive_name="$(basename "${archives[0]}")"
          PYTHONPATH=src python -m {my_project}_dev.packaging.release_assets upload \
            --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" --directory dist --files "$archive_name"

  github-release:
    name: Validate and publish GitHub Release
    if: github.event_name == 'push'
    needs:
      - build
      - installation-bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: false
      - name: Validate staged assets and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          PYTHONPATH=src python -m {my_project}_dev.packaging.release_assets
          finalize --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME"
          --commit "$GITHUB_SHA"

  pypi-publish:
    name: Publish to PyPI
    if: >-
      github.event_name == 'push' &&
      needs.build.outputs.release_pypi == 'true'
    needs:
      - build
      - github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Download package assets from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
      - name: Publish to PyPI with trusted publishing
        shell: bash
        run: |
          project_name="{my_project}"
          normalized_project="${project_name//_/-}"
          normalized_project="${normalized_project,,}"
          uv publish \
            --trusted-publishing always \
            --check-url "https://pypi.org/simple/${normalized_project}/" \
            dist/*
  manual_pypi_preflight:
    name: Check manual PyPI release policy
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish_pypi: ${{ steps.authorize.outputs.publish_pypi || 'false' }}
      artifact_id: ${{ steps.upload_snapshot.outputs.artifact-id }}
      release_id: ${{ steps.release_policy.outputs.release_id }}
      release_tag: ${{ steps.release_policy.outputs.release_tag }}
      active_commit_sha: ${{ steps.release_policy.outputs.active_commit_sha }}
      tag_object_sha: ${{ steps.release_policy.outputs.tag_object_sha }}
      target_commit_sha: ${{ steps.release_policy.outputs.target_commit_sha }}
      manifest_sha256: ${{ steps.release_policy.outputs.manifest_sha256 }}
      wheel_name: ${{ steps.release_policy.outputs.wheel_name }}
      sdist_name: ${{ steps.release_policy.outputs.sdist_name }}

    steps:
      - name: Checkout workflow-run commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Validate workflow-run commit and requested tag
        id: release_policy
        env:
          ACTIVE_WORKFLOW_SHA: ${{ github.sha }}
          ACTIVE_WORKFLOW_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PACKAGE_NAME: {my_project}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag '${RELEASE_TAG}'; expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if ! active_commit="$(git rev-parse --verify "${ACTIVE_WORKFLOW_SHA}^{commit}" 2>/dev/null)"; then
            echo "Workflow-run commit ${ACTIVE_WORKFLOW_SHA} does not resolve to a commit." >&2
            exit 1
          fi
          if ! checked_out_commit="$(git rev-parse --verify HEAD 2>/dev/null)" || [[ "$active_commit" != "$checked_out_commit" ]]; then
            echo "Checked-out commit ${checked_out_commit:-unknown} does not match workflow-run commit ${ACTIVE_WORKFLOW_SHA}." >&2
            exit 1
          fi
          tag_ref="refs/tags/$RELEASE_TAG"
          if ! git fetch --no-tags origin "$tag_ref:$tag_ref"; then
            echo "Could not fetch target tag ${RELEASE_TAG}." >&2
            exit 1
          fi
          if ! tag_object_sha="$(git rev-parse --verify --end-of-options "$tag_ref" 2>/dev/null)"; then
            echo "Exact target tag ref ${tag_ref} does not resolve." >&2
            exit 1
          fi
          if ! target_commit="$(git rev-parse --verify --end-of-options "$tag_ref"^{commit} 2>/dev/null)"; then
            echo "Exact target tag ref ${tag_ref} does not peel to a commit." >&2
            exit 1
          fi
          if [[ ! "$tag_object_sha" =~ ^[0-9a-f]{40,64}$ || ! "$target_commit" =~ ^[0-9a-f]{40,64}$ ]]; then
            echo "The target tag did not resolve to immutable Git object IDs." >&2
            exit 1
          fi

          read_release_policy() {
            local commit="$1"
            local ref_name="$2"
            local policy_file
            local release_pypi
            policy_file="$(mktemp)"
            if ! git show "${commit}:justfile" > "$policy_file"; then
              rm -f "$policy_file"
              echo "Could not read justfile from ${ref_name}." >&2
              return 1
            fi
            if ! release_pypi="$(just --no-dotenv --justfile "$policy_file" --evaluate RELEASE_PYPI)"; then
              rm -f "$policy_file"
              echo "Could not evaluate RELEASE_PYPI from ${ref_name}." >&2
              return 1
            fi
            rm -f "$policy_file"
            if [[ "$release_pypi" != "true" && "$release_pypi" != "false" ]]; then
              echo "RELEASE_PYPI must be \"true\" or \"false\" in ${ref_name}, found '${release_pypi}'." >&2
              return 1
            fi
            printf '%s\n' "$release_pypi"
          }

          active_policy="$(read_release_policy "$active_commit" "workflow-run commit ${ACTIVE_WORKFLOW_SHA} (ref ${ACTIVE_WORKFLOW_REF})")"
          target_policy="$(read_release_policy "$target_commit" "target tag ${RELEASE_TAG}")"
          if [[ "$active_policy" != "true" || "$target_policy" != "true" ]]; then
            echo "Manual PyPI publication is disabled unless RELEASE_PYPI is \"true\" in both committed justfiles."
            echo "snapshot_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          release_metadata="$(mktemp)"
          trap 'rm -f "$release_metadata"' EXIT
          gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$release_metadata"
          release_id="$(jq -er '.id | select(type == "number" and . > 0)' "$release_metadata")"
          release_tag="$(jq -er '.tag_name | select(type == "string")' "$release_metadata")"
          is_draft="$(jq -r '.draft | select(type == "boolean") | tostring' "$release_metadata")"
          if [[ "$release_tag" != "$RELEASE_TAG" || "$is_draft" != "false" ]]; then
            echo "GitHub Release must be non-draft and identify exact tag $RELEASE_TAG." >&2
            exit 1
          fi
          version="$(cut -c 2- <<< "$RELEASE_TAG")"
          wheel_count="$(jq '[.assets[].name | select(endswith(".whl"))] | length' "$release_metadata")"
          sdist_count="$(jq '[.assets[].name | select(endswith(".tar.gz"))] | length' "$release_metadata")"
          if [[ "$wheel_count" != "1" || "$sdist_count" != "1" ]]; then
            echo "GitHub Release $RELEASE_TAG must contain exactly one wheel and one source archive." >&2
            exit 1
          fi
          wheel_name="$(jq -er '[.assets[].name | select(endswith(".whl"))][0]' "$release_metadata")"
          sdist_name="$(jq -er '[.assets[].name | select(endswith(".tar.gz"))][0]' "$release_metadata")"
          if [[ "$wheel_name" != "$PACKAGE_NAME-$version-"*.whl || "$sdist_name" != "$PACKAGE_NAME-$version.tar.gz" || "$wheel_name" == */* || "$wheel_name" == *$'\n'* || "$wheel_name" == *$'\r'* ]]; then
            echo "Release asset filenames do not match tag $RELEASE_TAG." >&2
            exit 1
          fi
          wheel_asset_id="$(jq -er --arg name "$wheel_name" '.assets[] | select(.name == $name) | .id | select(type == "number" and . > 0)' "$release_metadata")"
          sdist_asset_id="$(jq -er --arg name "$sdist_name" '.assets[] | select(.name == $name) | .id | select(type == "number" and . > 0)' "$release_metadata")"

          snapshot_dir="manual-pypi-snapshot"
          mkdir "$snapshot_dir"
          gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$wheel_asset_id" --header "Accept: application/octet-stream" > "$snapshot_dir/$wheel_name"
          gh api "/repos/$GITHUB_REPOSITORY/releases/assets/$sdist_asset_id" --header "Accept: application/octet-stream" > "$snapshot_dir/$sdist_name"
          expected_files="$(printf '%s\n%s' "$sdist_name" "$wheel_name" | LC_ALL=C sort)"
          actual_files="$(find "$snapshot_dir" -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort)"
          if [[ "$actual_files" != "$expected_files" || ! -f "$snapshot_dir/$wheel_name" || -L "$snapshot_dir/$wheel_name" || ! -f "$snapshot_dir/$sdist_name" || -L "$snapshot_dir/$sdist_name" ]]; then
            echo "Downloaded release files do not match the selected wheel and source archive." >&2
            exit 1
          fi
          uvx --from twine twine check "$snapshot_dir/$wheel_name" "$snapshot_dir/$sdist_name"

          python3 - "$snapshot_dir/manifest.json" "$release_id" "$RELEASE_TAG" "$active_commit" "$tag_object_sha" "$target_commit" "$wheel_name" "$sdist_name" <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          manifest_path, release_id, tag, active_sha, tag_object_sha, target_sha, wheel_name, sdist_name = sys.argv[1:]
          snapshot_dir = Path(manifest_path).parent
          packages = []
          for filename in (wheel_name, sdist_name):
              digest = hashlib.sha256((snapshot_dir / filename).read_bytes()).hexdigest()
              packages.append({"filename": filename, "sha256": digest})
          manifest = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "release_id": int(release_id),
              "release_tag": tag,
              "workflow_run_commit_sha": active_sha,
              "tag_object_sha": tag_object_sha,
              "tag_commit_sha": target_sha,
              "packages": packages,
          }
          Path(manifest_path).write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          if ! final_remote_tag="$(git ls-remote --exit-code --refs origin "$tag_ref")"; then
            echo "Exact remote tag ref $tag_ref disappeared during asset capture." >&2
            exit 1
          fi
          if [[ "$final_remote_tag" != "$tag_object_sha"$'\t'"$tag_ref" ]]; then
            echo "Exact remote tag ref $tag_ref changed during asset capture." >&2
            exit 1
          fi

          manifest_sha256="$(sha256sum "$snapshot_dir/manifest.json" | cut -d ' ' -f 1)"
          {
            echo "release_id=$release_id"
            echo "release_tag=$RELEASE_TAG"
            echo "active_commit_sha=$active_commit"
            echo "tag_object_sha=$tag_object_sha"
            echo "target_commit_sha=$target_commit"
            echo "manifest_sha256=$manifest_sha256"
            echo "wheel_name=$wheel_name"
            echo "sdist_name=$sdist_name"
            echo "snapshot_ready=true"
          } >> "$GITHUB_OUTPUT"

      - name: Upload validated release snapshot
        id: upload_snapshot
        if: steps.release_policy.outputs.snapshot_ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: manual-pypi-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            manual-pypi-snapshot/manifest.json
            manual-pypi-snapshot/${{ steps.release_policy.outputs.wheel_name }}
            manual-pypi-snapshot/${{ steps.release_policy.outputs.sdist_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Authorize publication after snapshot upload
        id: authorize
        if: >-
          steps.release_policy.outputs.snapshot_ready == 'true' &&
          steps.upload_snapshot.outcome == 'success' &&
          steps.upload_snapshot.outputs.artifact-id != ''
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload_snapshot.outputs.artifact-id }}
        run: |
          set -euo pipefail
          if [[ -z "$ARTIFACT_ID" ]]; then
            echo "Validated release snapshot has no artifact ID." >&2
            exit 1
          fi
          echo "publish_pypi=true" >> "$GITHUB_OUTPUT"

  publish-existing-release:
    name: Publish existing GitHub Release to PyPI
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.manual_pypi_preflight.result == 'success' &&
      needs.manual_pypi_preflight.outputs.publish_pypi == 'true' &&
      needs.manual_pypi_preflight.outputs.artifact_id != ''
    needs: manual_pypi_preflight
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Download the preflight snapshot by artifact ID
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.manual_pypi_preflight.outputs.artifact_id }}
          path: manual-pypi-snapshot

      - name: Verify the preflight manifest and package hashes
        env:
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_RELEASE_ID: ${{ needs.manual_pypi_preflight.outputs.release_id }}
          EXPECTED_RELEASE_TAG: ${{ needs.manual_pypi_preflight.outputs.release_tag }}
          EXPECTED_ACTIVE_COMMIT_SHA: ${{ needs.manual_pypi_preflight.outputs.active_commit_sha }}
          EXPECTED_TAG_OBJECT_SHA: ${{ needs.manual_pypi_preflight.outputs.tag_object_sha }}
          EXPECTED_TARGET_COMMIT_SHA: ${{ needs.manual_pypi_preflight.outputs.target_commit_sha }}
          EXPECTED_MANIFEST_SHA256: ${{ needs.manual_pypi_preflight.outputs.manifest_sha256 }}
          EXPECTED_WHEEL_NAME: ${{ needs.manual_pypi_preflight.outputs.wheel_name }}
          EXPECTED_SDIST_NAME: ${{ needs.manual_pypi_preflight.outputs.sdist_name }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          snapshot_dir = Path("manual-pypi-snapshot")
          manifest_path = snapshot_dir / "manifest.json"
          wheel_name = os.environ["EXPECTED_WHEEL_NAME"]
          sdist_name = os.environ["EXPECTED_SDIST_NAME"]
          expected_names = sorted(("manifest.json", wheel_name, sdist_name))
          entries = sorted(path.name for path in snapshot_dir.iterdir())
          if entries != expected_names:
              raise SystemExit("Preflight artifact contains missing or unexpected files.")
          for filename in expected_names:
              path = snapshot_dir / filename
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"Preflight artifact entry is not a regular file: {filename}")
          manifest_bytes = manifest_path.read_bytes()
          manifest_sha256 = hashlib.sha256(manifest_bytes).hexdigest()
          if manifest_sha256 != os.environ["EXPECTED_MANIFEST_SHA256"]:
              raise SystemExit("Preflight manifest hash does not match the recorded output.")
          manifest = json.loads(manifest_bytes)
          expected_identity = {
              "schema_version": 1,
              "repository": os.environ["EXPECTED_REPOSITORY"],
              "release_id": int(os.environ["EXPECTED_RELEASE_ID"]),
              "release_tag": os.environ["EXPECTED_RELEASE_TAG"],
              "workflow_run_commit_sha": os.environ["EXPECTED_ACTIVE_COMMIT_SHA"],
              "tag_object_sha": os.environ["EXPECTED_TAG_OBJECT_SHA"],
              "tag_commit_sha": os.environ["EXPECTED_TARGET_COMMIT_SHA"],
          }
          for key, value in expected_identity.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Preflight manifest identity mismatch for {key}.")
          expected_packages = {wheel_name, sdist_name}
          packages = manifest.get("packages")
          if not isinstance(packages, list) or {item.get("filename") for item in packages if isinstance(item, dict)} != expected_packages or len(packages) != 2:
              raise SystemExit("Preflight manifest package set does not match the expected release files.")
          for package in packages:
              filename = package["filename"]
              digest = hashlib.sha256((snapshot_dir / filename).read_bytes()).hexdigest()
              if package.get("sha256") != digest:
                  raise SystemExit(f"Preflight package hash mismatch for {filename}.")
          PY

      - name: Publish existing artifacts to PyPI
        env:
          WHEEL_NAME: ${{ needs.manual_pypi_preflight.outputs.wheel_name }}
          SDIST_NAME: ${{ needs.manual_pypi_preflight.outputs.sdist_name }}
        shell: bash
        run: |
          project_name="{my_project}"
          normalized_project="${project_name//_/-}"
          normalized_project="${normalized_project,,}"
          uv publish \
            --trusted-publishing always \
            --check-url "https://pypi.org/simple/${normalized_project}/" \
            "manual-pypi-snapshot/$WHEEL_NAME" \
            "manual-pypi-snapshot/$SDIST_NAME"
