name: CI

run-name: ${{ github.actor }} - ${{ github.event_name }} - CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto
      - name: Install project from uv.lock
        run: uv sync --locked --all-extras --all-groups
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run --locked ruff format . --check
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked pyright
      - name: Test
        env:
          NO_COLOR: "1"
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: uv run --locked pytest
      - name: Compile sources
        run: uv run --locked python -m compileall -q src tests

  installation:
    name: ${{ matrix.target }} install / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            python-version: "3.12"
            target: windows-x86_64
          - runner: windows-latest
            python-version: "3.13"
            target: windows-x86_64
          - runner: ubuntu-latest
            python-version: "3.12"
            target: linux-x86_64
          - runner: ubuntu-latest
            python-version: "3.13"
            target: linux-x86_64
          - runner: macos-14
            python-version: "3.12"
            target: macos-arm64
          - runner: macos-14
            python-version: "3.13"
            target: macos-arm64
    env:
      UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
      UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-tools/bin
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: auto
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - name: Install project from uv.lock
        run: uv sync --locked --all-extras --all-groups
      - name: Build and install the local thin payload
        env:
          RELEASE_REPOSITORY: "{github_user}/{my_project}"
          RELEASE_TARGET: ${{ matrix.target }}
        run: just release-install-smoke
