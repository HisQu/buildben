name: CI

run-name: ${{ github.actor }} - ${{ github.event_name }} - CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Bun for React packaging
        if: hashFiles('frontend/package.json') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: auto
      - name: Install project from uv.lock
        run: uv sync --locked --all-extras --all-groups
      - name: Check lockfile
        run: uv lock --check
      - name: Check formatting
        run: uv run --locked ruff format . --check
      - name: Lint
        run: uv run --locked ruff check .
      - name: Type check
        run: uv run --locked pyright
      - name: Test
        env:
          NO_COLOR: "1"
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
        run: uv run --locked pytest
      - name: Compile sources
        run: uv run --locked python -m compileall -q src tests

  installation:
    name: ${{ matrix.target }} install / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            python-version: "3.12"
            target: linux-x86_64
          - runner: ubuntu-latest
            python-version: "3.13"
            target: linux-x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Bun for React native setup authoring
        if: hashFiles('frontend/package.json') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python-version }}
          enable-cache: auto
      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"
      - name: Install project from uv.lock
        run: uv sync --locked --all-extras --all-groups
      - name: Install native compiler target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install pinned native linker tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm lld
          cargo install cargo-xwin --version 0.23.1 --locked
      - name: Register and inspect the editable checkout
        run: just release-install-smoke

<frontend_ci_job>
