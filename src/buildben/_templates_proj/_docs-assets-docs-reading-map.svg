<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">{my_project} documentation reading map</title>
  <desc id="desc">The root README points to Documentation, then Explanations, How-to user guides, References, Examples, and Development.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666666" />
    </marker>
    <style>
      text { font-family: sans-serif; fill: #000000; }
      .title { font-size: 20px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; }
      .box { fill: #f4f4f4dd; stroke: #666666; stroke-width: 2; rx: 8; }
      .line { stroke: #666666; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="28" y="18" width="420" height="40" fill="#f4f4f4dd" stroke="#666666" stroke-width="1.5" rx="8" />
  <text class="title" x="40" y="44">{my_project} Documentation Map</text>
  <rect class="box" x="60" y="92" width="180" height="88" />
  <text class="label" x="88" y="128">Root README</text>
  <text class="small" x="86" y="154">Short entry point</text>
  <rect class="box" x="400" y="92" width="180" height="88" />
  <text class="label" x="418" y="128">Documentation</text>
  <text class="small" x="428" y="154">Reading order</text>
  <line class="line" x1="240" y1="136" x2="390" y2="136" />
  <rect class="box" x="20" y="248" width="170" height="70" />
  <text class="label" x="40" y="278">Explanations</text>
  <text class="small" x="40" y="302">Components</text>
  <rect class="box" x="210" y="248" width="190" height="70" />
  <text class="label" x="222" y="278">How-to user guides</text>
  <text class="small" x="230" y="302">Complete a task</text>
  <rect class="box" x="420" y="248" width="170" height="70" />
  <text class="label" x="442" y="278">References</text>
  <text class="small" x="442" y="302">Exact names</text>
  <rect class="box" x="610" y="248" width="160" height="70" />
  <text class="label" x="630" y="278">Examples</text>
  <text class="small" x="630" y="302">Complete setups</text>
  <rect class="box" x="790" y="248" width="170" height="70" />
  <text class="label" x="810" y="278">Development</text>
  <text class="small" x="810" y="302">Maintainer workflow</text>
  <line class="line" x1="440" y1="180" x2="105" y2="240" />
  <line class="line" x1="465" y1="180" x2="305" y2="240" />
  <line class="line" x1="490" y1="180" x2="505" y2="240" />
  <line class="line" x1="515" y1="180" x2="690" y2="240" />
  <line class="line" x1="540" y1="180" x2="875" y2="240" />
</svg>
